name: CI

on:
  push:
    branches:
      - main
  pull_request:


concurrency:
  group: ${{ github.workflows }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main }}

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code --go.mod go.sum

      - name: Verify downloaded modules
        run: go mod verify

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
     
      - name: Check Formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            exit 1
          fi
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [deps, lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build backend
        run: go build -o /dev/null ./cmd/server

